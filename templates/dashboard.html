<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SustainAI Dashboard</title>
    <style>
        :root { --bg: #050505; --card: #121212; --border: #222; --accent: #2d6a4f; --text: #eee; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 240px; border-right: 1px solid var(--border); padding: 20px; }
        .nav-link { padding: 12px; cursor: pointer; border-radius: 8px; list-style: none; color: #666; margin-bottom: 5px; }
        .nav-link.active { background: #1a1a1a; color: white; }
        .main-workspace { flex: 1; padding: 30px; }
        .view-container { display: none; }
        .view-container.active-view { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .bento-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        .big-val { font-size: 2rem; color: #52b788; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h3>🌿 SustainAI</h3>
        <li class="nav-link active" onclick="switchView('intelligence')">Intelligence Chat</li>
        <li class="nav-link" onclick="switchView('audit')">Wardrobe Audit</li>
        <div style="margin-top: 50px;"><a href="/logout" style="color: red; text-decoration: none;">Sign Out</a></div>
    </nav>

    <main class="main-workspace">
        <div id="intelligence-view" class="view-container active-view">
            <div class="bento-card" style="grid-column: 1 / 3; height: 400px;">
                <h4>Dialogue</h4>
                <div id="chatbox" style="height: 300px; overflow-y: auto;"></div>
                <input type="text" id="uInp" placeholder="Ask about fabric...">
                <button onclick="processRequest()">Analyze</button>
            </div>
            <div class="bento-card"><h4>Score</h4><div id="sVal" class="big-val">--</div></div>
            <div class="bento-card"><h4>Water</h4><div id="wVal" class="big-val">--</div></div>
            <div class="bento-card" style="grid-column: 3 / 5;"><h4>Analysis</h4><p id="nVal">--</p></div>
        </div>

        <div id="audit-view" class="view-container">
            <div class="bento-card" style="grid-column: 1/5; text-align: center;">
                <h2>Wardrobe Audit</h2>
                <p>Track your sustainable collection here.</p>
            </div>
        </div>
    </main>

    <script>
        function switchView(v) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('intelligence-view').style.display = v === 'intelligence' ? 'grid' : 'none';
            document.getElementById('audit-view').style.display = v === 'audit' ? 'grid' : 'none';
        }

        async function processRequest() {
            const val = document.getElementById('uInp').value;
            const res = await fetch('/chat', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/x-www-form-urlencoded'}, 
                body: `message=${val}` 
            });
            const data = await res.json();
            if(data.status === "success") {
                document.getElementById('sVal').innerText = data.score;
                document.getElementById('wVal').innerText = data.water;
                document.getElementById('nVal').innerText = data.notes;
            }
        }
    </script>
</body>
</html>
