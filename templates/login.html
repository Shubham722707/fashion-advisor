<body style="background: #050505; color: white; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <form method="POST" style="background: #121212; padding: 40px; border-radius: 20px; width: 300px;">
        <h2>Login</h2>
        <input name="username" placeholder="Username" style="width: 100%; margin: 10px 0; padding: 10px;">
        <input name="password" type="password" placeholder="Password" style="width: 100%; margin: 10px 0; padding: 10px;">
        <button type="submit" style="width: 100%; background: #2d6a4f; color: white; border: none; padding: 10px; cursor: pointer;">Enter</button>
        <p>New? <a href="/signup" style="color: #52b788;">Sign up</a></p>
    </form>
</body>
