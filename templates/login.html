<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5;">
    <form method="POST" style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px;">
        <h2 style="color: #2d6a4f;">Login to EcoStyle</h2>
        <input name="username" placeholder="Username" style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px;">
        <input name="password" type="password" placeholder="Password" style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px;">
        <button type="submit" style="width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; border-radius: 6px; cursor: pointer;">Login</button>
        <p style="font-size: 0.9rem; text-align: center;">New here? <a href="/signup">Sign up</a></p>
    </form>
</body>
